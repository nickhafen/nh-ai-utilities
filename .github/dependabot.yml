# Dependabot covers anything with a standard manifest. This repo has none
# (CDN/vendored JS is handled by .github/workflows/dependency-watch.yml), so
# it only keeps the GitHub Actions used by our workflows up to date.
#
# For other apps, uncomment the ecosystems they use.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

