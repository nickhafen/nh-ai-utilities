<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Link Checker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='38' cy='38' r='26' fill='none' stroke='%231a73e8' stroke-width='12'/><line x1='57' y1='57' x2='84' y2='84' stroke='%231a73e8' stroke-width='12' stroke-linecap='round'/></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 2.5rem 1rem;
    }

    .container { max-width: 960px; margin: 0 auto; }

    /* ── Header ── */
    header { margin-bottom: 2rem; }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    header p  { color: #666; margin-top: 0.3rem; font-size: 0.95rem; }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.09);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #777;
      margin-bottom: 1rem;
    }

    /* ── Tags ── */
    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      align-items: center;
    }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: #e8f0fe;
      color: #1557b0;
      border-radius: 999px;
      padding: 0.3rem 0.7rem 0.3rem 0.9rem;
      font-size: 0.8rem;
      font-family: 'SFMono-Regular', Consolas, monospace;
    }
    .tag-chip button {
      background: none; border: none; cursor: pointer;
      color: #1557b0; font-size: 1.1rem; line-height: 1;
      padding: 0; opacity: 0.45;
    }
    .tag-chip button:hover { opacity: 1; }

    .add-row { display: flex; gap: 0.5rem; }
    .add-row input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 7px;
      padding: 0.5rem 0.75rem;
      font-size: 0.88rem;
      font-family: 'SFMono-Regular', Consolas, monospace;
      color: #1a1a2e;
    }
    .add-row input:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26,115,232,.15);
    }
    .add-row input::placeholder { color: #aaa; font-family: inherit; }

    .btn {
      padding: 0.5rem 1.1rem;
      border: none; border-radius: 7px;
      cursor: pointer; font-size: 0.88rem; font-weight: 500;
    }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-primary:hover { background: #1557b0; }
    .btn-ghost { background: #f1f3f4; color: #333; }
    .btn-ghost:hover { background: #e2e5e9; }

    /* ── Drop zone ── */
    #drop-area {
      border: 2px dashed #ccc;
      border-radius: 10px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      user-select: none;
    }
    #drop-area:hover, #drop-area.drag-over {
      border-color: #1a73e8;
      background: #f0f5ff;
    }
    #drop-area .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    #drop-area .primary-text { font-size: 1rem; color: #333; margin-bottom: 0.35rem; }
    #drop-area .hint { font-size: 0.82rem; color: #999; margin-top: 0.75rem; }

    /* ── Summary bar ── */
    .summary {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .summary .icon { font-size: 1.4rem; }
    .summary strong { font-size: 1rem; }
    .summary .fname {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.88rem; color: #555;
    }

    /* ── Results table ── */
    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th {
      text-align: left; padding: 0.6rem 0.75rem;
      background: #f8f9fa; color: #555; font-weight: 600;
      border-bottom: 2px solid #e9ecef; white-space: nowrap;
    }
    td {
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid #f1f3f4;
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbfc; }

    .col-text { width: 35%; }
    .col-url  {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.8rem;
      word-break: break-all;
    }

    .empty { color: #bbb; font-style: italic; }

    /* ── Highlight ── */
    mark {
      background: #fde68a;
      color: #78350f;
      padding: 1px 3px;
      border-radius: 3px;
      font-style: normal;
    }

    /* ── Clean result ── */
    .clean {
      text-align: center; padding: 2.5rem 1rem; color: #2e7d32;
    }
    .clean .big { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .clean p { font-size: 0.95rem; }

    /* ── Reset row ── */
    .reset-row { margin-top: 1.25rem; display: flex; justify-content: flex-end; gap: 0.5rem; }

    footer { text-align: center; font-size: 0.78rem; color: #aaa; margin-top: 1rem; }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>AI Link Checker</h1>
    <p>Scan .docx files for visible text and hyperlinks containing AI platform tracking parameters. A clean result does not rule out AI use.</p>
  </header>

  <!-- Tags card -->
  <div class="card">
    <h2>Tags to detect</h2>
    <div id="tags-list" class="tags-row"></div>
    <div class="add-row">
      <input id="tag-input" type="text" placeholder="e.g. utm_source=claude.ai" />
      <button class="btn btn-primary" id="add-btn">Add</button>
    </div>
  </div>

  <!-- Drop zone card -->
  <div class="card" id="drop-card">
    <div id="drop-area">
      <div class="icon">📄</div>
      <p class="primary-text">Drop a <strong>.docx</strong> file here, or click to browse</p>
      <p class="hint">Your file is never uploaded to the internet — everything runs in your browser</p>
    </div>
    <input id="file-input" type="file" accept=".docx" style="display:none">
  </div>

  <!-- Results card -->
  <div class="card" id="results-card" style="display:none">
    <div id="results-content"></div>
    <div class="reset-row">
      <button class="btn btn-primary" id="rerun-btn">Re-run search</button>
      <button class="btn btn-ghost" id="reset-btn">Check another file</button>
    </div>
  </div>

  

</div>
<script>
  // ── Default tags ───────────────────────────────────────────────────────────
  const DEFAULT_TAGS = [
    'utm_source=chatgpt.com',
    'utm_source=openai',
    'utm_source=copilot.com',
    'utm_source=gemini',
    'utm_source=perplexity',
    'utm_source=perplexity.ai',
    'utm_source=gemini.google.com',
    'utm_source=mistral',
    'referrer=grok.com',
  ];

  let tags = [...DEFAULT_TAGS];

  // Persisted across re-runs so the file doesn't need to be re-uploaded
  let loadedZip      = null;
  let loadedFilename = '';

  // ── Utilities ──────────────────────────────────────────────────────────────
  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Wrap each matched tag in <mark>. Works on plain-text input, returns safe HTML.
  // Uses a capturing-group regex split so matching is case-insensitive while the
  // original casing of the matched text is preserved in the output.
  function highlight(str, matchedTags) {
    if (!str) return '';
    if (!matchedTags || !matchedTags.length) return escHtml(str);
    let parts = [{ text: str, isMatch: false }];
    for (const tag of matchedTags) {
      const re = new RegExp(`(${escRe(tag)})`, 'gi');
      parts = parts.flatMap(p => {
        if (p.isMatch) return [p];
        // split() with a capturing group returns [non, match, non, match, ...]
        return p.text.split(re).map((seg, i) => ({ text: seg, isMatch: i % 2 === 1 }));
      });
    }
    return parts.map(p =>
      p.isMatch ? `<mark>${escHtml(p.text)}</mark>` : escHtml(p.text)
    ).join('');
  }

  // ── Tag management ─────────────────────────────────────────────────────────
  function renderTags() {
    document.getElementById('tags-list').innerHTML = tags.map((t, i) => `
      <span class="tag-chip">
        ${escHtml(t)}
        <button data-i="${i}" title="Remove">&times;</button>
      </span>`).join('');
  }

  function addTag() {
    const inp = document.getElementById('tag-input');
    const val = inp.value.trim();
    if (val && !tags.includes(val)) { tags.push(val); renderTags(); }
    inp.value = '';
    inp.focus();
  }

  document.getElementById('add-btn').addEventListener('click', addTag);
  document.getElementById('tag-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTag();
  });
  document.getElementById('tags-list').addEventListener('click', e => {
    const btn = e.target.closest('button[data-i]');
    if (btn) { tags.splice(+btn.dataset.i, 1); renderTags(); }
  });

  // ── Drop zone ──────────────────────────────────────────────────────────────
  const dropArea  = document.getElementById('drop-area');
  const fileInput = document.getElementById('file-input');

  dropArea.addEventListener('click',     () => fileInput.click());
  dropArea.addEventListener('dragover',  e  => { e.preventDefault(); dropArea.classList.add('drag-over'); });
  dropArea.addEventListener('dragleave', ()  => dropArea.classList.remove('drag-over'));
  dropArea.addEventListener('drop', e => {
    e.preventDefault();
    dropArea.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) processFile(e.target.files[0]);
  });

  document.getElementById('rerun-btn').addEventListener('click', runScan);

  document.getElementById('reset-btn').addEventListener('click', () => {
    document.getElementById('results-card').style.display = 'none';
    document.getElementById('drop-card').style.display   = 'block';
    loadedZip      = null;
    loadedFilename = '';
    fileInput.value = '';
  });

  // ── Core scan ──────────────────────────────────────────────────────────────
  // A .docx hyperlink can live in any XML part — body, footnotes, endnotes,
  // headers, footers, comments — each with its own scoped .rels file.
  // The previous version only looked in word/document.xml, which is why the
  // footnote link was detected (via the fallback rels scan) but its visible
  // text was never found (that's in word/footnotes.xml).
  //
  // Fix: for every .rels file, derive the partner XML path, build a URL map
  // scoped to that part, then scan that XML for <w:hyperlink> elements.
  // This correctly pairs visible text with URLs across all document parts.
  //
  // A direct .rels fallback still runs after, so anything the pairing misses
  // (unusual structures) is still detected — just without visible text.

  async function processFile(file) {
    if (!file.name.toLowerCase().endsWith('.docx')) {
      alert('Please select a .docx file.');
      return;
    }
    let zip;
    try {
      zip = await JSZip.loadAsync(await file.arrayBuffer());
    } catch {
      alert('Could not read the file. Make sure it is a valid .docx.');
      return;
    }
    loadedZip      = zip;
    loadedFilename = file.name;
    runScan();
  }

  function runScan() {
    if (!loadedZip) return;
    if (!tags.length) {
      alert('Add at least one tag to search for.');
      return;
    }
    const zip      = loadedZip;
    const filename = loadedFilename;

    (async () => {
    const results  = [];
    const seenUrls = new Set();

    // ── Steps 1+2: for each .rels file, scan its partner XML part ────────────
    //
    // word/_rels/document.xml.rels  →  word/document.xml
    // word/_rels/footnotes.xml.rels →  word/footnotes.xml   ← the test case
    // word/_rels/endnotes.xml.rels  →  word/endnotes.xml
    // word/_rels/header1.xml.rels   →  word/header1.xml  … etc.

    for (const [relsPath, relsEntry] of Object.entries(zip.files)) {
      if (relsEntry.dir || !relsPath.endsWith('.rels')) continue;

      // Derive the XML partner path from the rels path
      const m = relsPath.match(/^(.*)\/_rels\/(.+)\.rels$/);
      if (!m) continue;
      const xmlPath  = `${m[1]}/${m[2]}`;
      const xmlEntry = zip.files[xmlPath];
      if (!xmlEntry) continue;

      // Build URL map scoped to this XML part (IDs are per-part, not global)
      let relsText;
      try { relsText = (await relsEntry.async('string')).replace(/&amp;/g, '&'); }
      catch { continue; }

      const urlMap = {};
      for (const el of relsText.match(/<Relationship\b[^>]*>/g) || []) {
        const type   = (el.match(/Type="([^"]+)"/)   || [])[1] || '';
        const id     = (el.match(/\bId="([^"]+)"/)   || [])[1];
        const target = (el.match(/Target="([^"]+)"/) || [])[1];
        if (type.endsWith('/hyperlink') && id && target) urlMap[id] = target;
      }

      // Load the XML part regardless — even with no hyperlinks it may have plain text
      let xmlText;
      try { xmlText = (await xmlEntry.async('string')).replace(/&amp;/g, '&'); }
      catch { continue; }

      // ── Hyperlink scan (only when this part has hyperlink relationships) ──
      if (Object.keys(urlMap).length) {
        const hlRe = /<w:hyperlink\b([^>]*)>([\s\S]*?)<\/w:hyperlink>/g;
        for (const hm of xmlText.matchAll(hlRe)) {
          const attrs = hm[1];
          const body  = hm[2];

          // r:id is standard; also accept any prefix:id that looks like an rId
          const rIdMatch = attrs.match(/r:id="([^"]+)"/) ||
                           attrs.match(/\w+:id="(rId[^"]+)"/);
          const rId = rIdMatch ? rIdMatch[1] : null;
          const url = (rId && urlMap[rId]) ? urlMap[rId] : '';

          if (!url || url.startsWith('#')) continue;

          // Concatenate all <w:t> children to get the full anchor text
          const visibleText = [...body.matchAll(/<w:t(?:\s[^>]*)?>([^<]*)<\/w:t>/g)]
            .map(n => n[1]).join('');

          const urlMatches  = tags.filter(t => url.toLowerCase().includes(t.toLowerCase()));
          const textMatches = tags.filter(t => visibleText.toLowerCase().includes(t.toLowerCase()));

          if (urlMatches.length || textMatches.length) {
            results.push({ visibleText, url, urlMatches, textMatches });
            seenUrls.add(url);
          }
        }
      }

      // ── Plain text scan (always runs — catches non-hyperlinked tag text) ──
      const stripped = xmlText.replace(/<w:hyperlink\b[\s\S]*?<\/w:hyperlink>/g, '');
      for (const tm of stripped.matchAll(/<w:t(?:\s[^>]*)?>([^<]*)<\/w:t>/g)) {
        const text    = tm[1];
        const matches = tags.filter(t => text.toLowerCase().includes(t.toLowerCase()));
        if (matches.length) {
          results.push({ visibleText: text, url: '', urlMatches: [], textMatches: matches });
        }
      }
    }

    // ── Fallback: direct .rels scan for any URLs still not seen ──────────────
    for (const [name, entry] of Object.entries(zip.files)) {
      if (entry.dir || !name.endsWith('.rels')) continue;
      try {
        const relsText = (await entry.async('string')).replace(/&amp;/g, '&');
        for (const tag of tags) {
          if (!relsText.toLowerCase().includes(tag.toLowerCase())) continue;
          const re = new RegExp(`Target="([^"]*${escRe(tag)}[^"]*)"`, 'gi');
          for (const fm of relsText.matchAll(re)) {
            const url = fm[1];
            if (!seenUrls.has(url)) {
              results.push({ visibleText: '', url, urlMatches: [tag], textMatches: [] });
              seenUrls.add(url);
            }
          }
        }
      } catch { /* skip unreadable entries */ }
    }

    showResults(filename, results);
    })();
  }

  // ── Render results ─────────────────────────────────────────────────────────
  function showResults(filename, results) {
    if (!results.length) {
      document.getElementById('results-content').innerHTML = `
        <div class="clean">
          <div class="big">✅</div>
          <p>No matching tags found in <strong>${escHtml(filename)}</strong></p>
        </div>`;
    } else {
      // Sort: tag hidden in URL only (most notable) → tag in both → plain text only
      results.sort((a, b) => {
        const rank = r =>
          (r.urlMatches.length && !r.textMatches.length) ? 0 :
          (r.urlMatches.length &&  r.textMatches.length) ? 1 : 2;
        return rank(a) - rank(b);
      });

      const n = results.length;
      const rows = results.map(r => `
        <tr>
          <td class="col-text">
            ${r.visibleText
              ? highlight(r.visibleText, r.textMatches)
              : '<span class="empty">—</span>'}
          </td>
          <td class="col-url">
            ${r.url
              ? highlight(r.url, r.urlMatches)
              : '<span class="empty">—</span>'}
          </td>
        </tr>`).join('');

      document.getElementById('results-content').innerHTML = `
        <div class="summary">
          <span class="icon">⚠️</span>
          <div>
            <strong>${n} instance${n !== 1 ? 's' : ''} found</strong><br>
            <span class="fname">${escHtml(filename)}</span>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Visible Text</th>
                <th>URL</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    document.getElementById('drop-card').style.display   = 'none';
    document.getElementById('results-card').style.display = 'block';
    document.getElementById('results-card').scrollIntoView({ behavior: 'smooth' });
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  renderTags();
</script>
</body>
</html>
